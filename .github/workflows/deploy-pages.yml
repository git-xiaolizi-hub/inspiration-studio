name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 需要这三项权限：读代码、写 Pages、签发 OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 语音模型不提交进 git（229MB）。构建时从 Release 取，放进 public/model-packs/，
      # 这样部署后的站点里模型与页面同源，浏览器能直接取（Release 直链没有 CORS 头）。
      # onnx 因为超过 GitHub Pages 单文件 100MB 上限，已经切成三片。
      - name: Fetch ASR model pack from Release
        run: |
          mkdir -p public/model-packs/sense-voice
          BASE="https://github.com/${{ github.repository }}/releases/download/asr-v2"
          for f in model.int8.onnx.part00 model.int8.onnx.part01 model.int8.onnx.part02 tokens.txt; do
            curl -fSL --retry 3 -o "public/model-packs/sense-voice/$f" "$BASE/$f"
          done
          ls -lh public/model-packs/sense-voice/

      - name: Build (base = /<repo>/)
        run: npm run build
        env:
          # 项目页的地址是 https://<用户>.github.io/<仓库>/，资源必须带这个前缀
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
